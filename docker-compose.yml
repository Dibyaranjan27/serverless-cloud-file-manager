version: '3.8'

services:
  localstack:
    image: localstack/localstack:latest
    container_name: localstack_main
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      - SERVICES=s3,dynamodb,lambda
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - "C:\Users\Dibya\Desktop\code\New folder/localstack-data:/var/lib/localstack"
      - "C:\Users\Dibya\Desktop\code\New folder/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh"
      - "C:\Users\Dibya\Desktop\code\New folder/lambda:/lambda" # Mount lambda source so init script can zip it
      - "/var/run/docker.sock:/var/run/docker.sock"

  webapp:
    build: ./app
    container_name: flask_webapp
    ports:
      - "5000:5000"
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://localstack:4566
    depends_on:
      - localstack

